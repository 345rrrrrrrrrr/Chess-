# Deploys the static site to GitHub Pages using the "GitHub Actions" source.
#
# The app is fully static (no build step), so we upload the repo as-is and
# publish it. Runs on every push to the default branch and can be triggered
# by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/adaptive-chess-trainer-n4d7gq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
