# Deploys the static site to GitHub Pages.
#
# The app is fully static (no build step), so we just upload the repo as-is
# and publish it. Runs on pushes to the trainer branch and can be triggered
# by hand from the Actions tab.
#
# ONE-TIME SETUP (in the repo on github.com):
#   Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions"
# After that, every push here re-publishes the site automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/adaptive-chess-trainer-n4d7gq
  workflow_dispatch:

# Permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site lives at the repo root.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
